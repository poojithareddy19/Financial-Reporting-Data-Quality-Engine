[project]
name = "fin-dq-engine"
version = "0.1.0"
description = "Financial Reporting & Data Quality Engine: governed daily ETL with SQL reporting and anomaly detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "boto3>=1.34",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "markdown>=3.6",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "moto[s3,sns,secretsmanager]>=5.0",
    "testcontainers[postgres]>=4.4",
    "faker>=25.0",
    "ruff>=0.4",
    "mypy>=1.10,<3",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs>=2.2,<4",
    "boto3-stubs[s3,sns,secretsmanager,cloudwatch]",
    "aws-cdk-lib>=2.140",
    "constructs>=10.3",
]
dashboard = ["streamlit>=1.35", "plotly>=5.22"]

[project.scripts]
fin-dq = "fin_dq_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_dq_engine"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "B008"]

[tool.ruff.lint.pycodestyle]
max-line-length = 140  # long SQL literals inside strings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
"src/fin_dq_engine/reports/summary.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["fin_dq_engine"]
plugins = ["pydantic.mypy"]
# Kept on: a stale "type: ignore" that a newer stubs release made unnecessary should fail loudly
# rather than accumulate invisibly. Expect this to be the first thing to break after a stubs bump.
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*", "markdown", "structlog.*", "moto.*", "testcontainers.*", "faker.*", "aws_cdk.*", "constructs.*", "streamlit.*", "plotly.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL (testcontainers or FIN_DQ_TEST_DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["fin_dq_engine"]
branch = true
omit = ["*/dashboard/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
